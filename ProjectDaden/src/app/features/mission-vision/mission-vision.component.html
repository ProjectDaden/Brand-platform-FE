<daden-header />

<section id="mission">
    <daden-group-header
    title="Our Mission"
    subtitle="Tell us why your brand exists and who it serves."></daden-group-header>

    <div class="flex flex-col gap-6">
        <div>
            <daden-label>We exist to...</daden-label>
            <select class="daden-field"
              [value]="purposeSelectValue()"
              (change)="onPurposePick($event)">
                <option value="" disabled>Select a purpose...</option>
                @for (purpose of purposes; track purpose) {
                  <option [value]="purpose">{{ purpose }}</option>
                }
                <option value="custom">Custom (write your own)</option>
            </select>
            @if (purposeMode() === 'custom') {
              <daden-input
                class="mt-2"
                type="text"
                placeholder="Enter a custom purpose"
                [value]="session.purpose()"
                (valueChange)="updatePurpose($event)">
              </daden-input>
            }
        </div>

        <div>
            <daden-label>For...</daden-label>
            <select class="daden-field"
              [value]="audienceSelectValue()"
              (change)="onAudiencePick($event)">
                <option value="" disabled>Select an audience...</option>
                @for (audience of audiences; track audience) {
                  <option [value]="audience">{{ audience }}</option>
                }
                <option value="custom">Custom (write your own)</option>
            </select>
            @if (audienceMode() === 'custom') {
              <daden-input
                class="mt-2"
                type="text"
                placeholder="Enter a custom audience"
                [value]="session.audience()"
                (valueChange)="updateAudience($event)">
              </daden-input>
            }
        </div>
        <daden-detail>These choices shape your brand story and the people the preview speaks to.</daden-detail>
    </div>
</section>

<section id="mission-preview">
    <daden-group-header
    title="Mission Statement Preview"
    subtitle="See how your selections come together."></daden-group-header>
    <div class="p-4 bg-neutral-50 rounded-md border border-neutral-200">
        <p class="text-base font-medium">We exist to <span class="font-semibold text-neutral-900">{{ session.purpose() || '…' }}</span> for <span class="font-semibold text-neutral-900">{{ session.audience() || '…' }}</span>.</p>
    </div>
</section>

<daden-page-footer></daden-page-footer>

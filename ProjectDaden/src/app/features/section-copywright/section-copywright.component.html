<daden-header></daden-header>

<section id="copywriting">
    <daden-group-header
        title="Edit Your Copy"
        subtitle="These drafts start from your name, message, and tone. Edit them when you want the words to stay put.">
    </daden-group-header>

    <div class="flex flex-col gap-6">
        <div>
            <daden-label>About us</daden-label>
            <daden-input
                type="textarea"
                [rows]="4"
                [value]="session.aboutUs()"
                (valueChange)="updateAbout($event)">
            </daden-input>
            <daden-detail>Tell your brand’s story in your own voice.</daden-detail>
        </div>

        <div>
            <daden-label>Product description</daden-label>
            <daden-input
                type="textarea"
                [rows]="4"
                [value]="session.productDescription()"
                (valueChange)="updateProduct($event)">
            </daden-input>
            <daden-detail>Describe what you offer and why it matters.</daden-detail>
        </div>

        <div>
            <daden-label>Call to action</daden-label>
            <daden-input
                type="textarea"
                [rows]="2"
                [value]="session.cta()"
                (valueChange)="updateCta($event)">
            </daden-input>
            <daden-detail>This line is the button in the live preview.</daden-detail>
        </div>
    </div>
</section>

<section id="copywriting-preview">
    <daden-group-header
        title="Copywriting Preview"
        subtitle="The same words feed the landing page preview.">
    </daden-group-header>
    <div class="p-4 bg-neutral-50 rounded-md border border-neutral-200">
        <h3 class="text-lg font-semibold mb-2">About</h3>
        <p class="text-base leading-relaxed mb-4">{{ session.aboutUs() }}</p>
        <h3 class="text-lg font-semibold mb-2">Product</h3>
        <p class="text-base leading-relaxed mb-4">{{ session.productDescription() }}</p>
        <h3 class="text-lg font-semibold mb-2">Call to action</h3>
        <p class="text-base leading-relaxed">{{ session.cta() }}</p>
    </div>
</section>

<daden-page-footer></daden-page-footer>

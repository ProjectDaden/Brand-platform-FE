<div class="app-shell flex flex-col lg:flex-row h-screen max-h-screen overflow-hidden bg-white text-neutral-900">
  @if(this.isLoggedIn()) {
  <nav-sidebar class="flex lg:w-72 lg:shrink-0 lg:h-screen lg:overflow-hidden"></nav-sidebar>
  }
  <div class="app-main flex-1 min-h-0 overflow-y-auto bg-[#f7f6f3] text-neutral-900">
    <div class="mx-auto max-w-3xl px-6 py-8 lg:px-12 lg:py-12">
      @if( isLoading ) {
        <daden-loading></daden-loading>
      } @else {
        <router-outlet></router-outlet>
      }
      </div>
  </div>
  @if(this.isLoggedIn()) {
  <aside-previews class="flex flex-col border-t lg:border-t-0 lg:border-l border-neutral-200 bg-white px-4 py-5 lg:w-[420px] lg:shrink-0 lg:h-screen"></aside-previews>
  }
</div>

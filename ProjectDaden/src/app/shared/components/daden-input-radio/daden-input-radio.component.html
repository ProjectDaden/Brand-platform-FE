<input
  type="radio"
  [id]="id()"
  [name]="name()"
  [value]="value()"
  [checked]="internalValue === value()"
  [disabled]="disabled()"
  (change)="onRadioChange($event)"
  class="h-4 w-4 text-neutral-900 border-neutral-300 accent-neutral-900 focus:ring-neutral-900/20 mr-2
         disabled:cursor-default disabled:border-neutral-200 disabled:text-neutral-400"
/>

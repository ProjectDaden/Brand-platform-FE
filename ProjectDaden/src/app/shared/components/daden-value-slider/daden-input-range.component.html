<div class="relative flex items-center h-6">
  <div class="absolute inset-x-0 h-1.5 rounded-full bg-neutral-100 pointer-events-none">
    <div class="h-1.5 rounded-full bg-neutral-900" [style.width.%]="fillPercent()"></div>
  </div>
  <input
    type="range"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    (input)="onSliderChange($event)"
    class="tone-range relative z-10 w-full h-6 bg-transparent appearance-none cursor-pointer outline-none"
  />
</div>

<div class="relative w-full">
    <select
      class="daden-field appearance-none pr-10"
      [ngModel]="dropDownParts().selectedItem"
      (ngModelChange)="onModelChange($event)"
      [disabled]="dropDownParts().disabled"
    >
      <option value="" disabled>
        {{ dropDownParts().placeholder || 'Select...' }}
      </option>
      @for (option of dropDownParts().items; track $index) {
        <option [value]="option">
          {{ option }}
        </option>
      }
    </select>
    <span
      class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-neutral-400"
      [ngClass]="{
        'text-neutral-300': dropDownParts().disabled
      }"
    >
      <daden-icon icon="arrowDown" [strokeWidth]="2" class="size-4"></daden-icon>
    </span>
  </div>

@switch(type()) { @case('text') {
<input
  [id]="id()"
  [type]="type()"
  [disabled]="isDisabled()"
  [value]="value()"
  [placeholder]="placeholder()"
  (input)="onInputChange($event)"
  class="daden-field"
/>

} @case('number'){
<input
  [id]="id()"
  [type]="'number'"
  [disabled]="isDisabled()"
  [placeholder]="placeholder()"
  (input)="onInputChange($event)"
  class="daden-field"
/>
} @case('date') {
<input
  [id]="id()"
  [type]="'date'"
  [disabled]="isDisabled()"
  (input)="onInputChange($event)"
  class="daden-field"
/>
} @case('file') {
<input
  [id]="id()"
  [type]="'file'"
  [disabled]="isDisabled()"
  [attr.accept]="accept()"
  (change)="onFileChange($event)"
  class="daden-field cursor-pointer file:mr-4 file:rounded file:border-0 file:bg-neutral-900 file:px-3 file:py-1.5 file:text-xs file:font-medium file:text-white hover:file:bg-neutral-800 file:disabled:bg-neutral-300 file:disabled:text-neutral-500"
/>
} @case('textarea') {
<textarea
  [id]="id()"
  [rows]="rows()"
  [disabled]="isDisabled()"
  [placeholder]="placeholder()"
  [value]="value()"
  (input)="onInputChange($event)"
  class="daden-field min-h-[6rem] resize-y"
></textarea>
}
@case('email') {
  <input
    [id]="id()"
    [type]="'email'"
    [disabled]="isDisabled()"
    [placeholder]="placeholder()"
    (input)="onInputChange($event)"
    class="daden-field"
  />
}
@case('password') {
  <input
    [id]="id()"
    [type]="'password'"
    [disabled]="isDisabled()"
    [placeholder]="placeholder()"
    (input)="onInputChange($event)"
    class="daden-field"
  />
}
@case('checkbox') {
  <input
    [id]="id()"
    [type]="'checkbox'"
    [checked]="chechkValue()"
    class="h-4 w-4 rounded border-neutral-300 text-neutral-900 accent-neutral-900 focus:ring-neutral-900/20"
    (change)="onCheckboxChange($event)"
  />
} 
@case('range') {
  <input
    [id]="id()"
    [type]="'range'"
    [min]="minValue()"
    [max]="maxValue()"
    [step]="stepValue()"
    [value]="defaultValue()"
    [disabled]="isDisabled()"
    (input)="debouncedOnRangeChange($event)"
    class="mt-1 w-full h-1.5 bg-neutral-200 rounded-full appearance-none cursor-pointer accent-neutral-900"
  />
}
@case('color') {
  <input
    [id]="id()"
    [type]="'color'"
    [value]="selectedColor()"
    [disabled]="isDisabled()"
    (input)="onColorChange($event)"
    class="daden-field h-10 p-1 cursor-pointer"
  />
}
@default {
<p>Unsupported input type: {{ type() }}</p>
} }

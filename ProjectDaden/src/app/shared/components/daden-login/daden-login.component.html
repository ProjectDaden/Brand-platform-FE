<div class="min-h-[70vh] flex items-center justify-center">
    <section class="w-full max-w-md">
      <daden-group-header
        title="Login">
      </daden-group-header>
      <form (ngSubmit)="login()">
        <div class="mb-4">
          <daden-label
            for="username" 
            label="general.username">
          </daden-label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            [(ngModel)]="username" 
            class="daden-field">
        </div>
        <div class="mb-6">
          <daden-label
            for="password" 
            label="general.password">
          </daden-label>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password" 
            class="daden-field">
        </div>
        @if (error) {
          <p class="mb-4 text-sm text-red-600">{{ error }}</p>
        }
        <div class="flex justify-end">
          <daden-button 
            type="submit"
            label="button.login"
            (emitItem)="login()">
          </daden-button>
        </div>
      </form>
      <div class="mt-4 flex justify-end">
        <daden-button
          variant="secondary"
          label="button.continue-as-guest"
          (emitItem)="continueAsGuest()">
        </daden-button>
      </div>
      <p class="mt-6 text-sm text-neutral-500 text-center">Your brand stays on this device until you print it.</p>
    </section>
</div>

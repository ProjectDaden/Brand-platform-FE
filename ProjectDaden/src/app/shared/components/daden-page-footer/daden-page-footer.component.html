<div class="pt-2 pb-8 flex justify-between items-center gap-4">
	<p class="text-sm text-red-600">{{ stillInvalid() ? error() : '' }}</p>
	<div class="flex justify-end gap-2">
		<daden-button label="button.reset" variant="tertiary" color="red" (emitItem)="reset()"></daden-button>
		@if (nextPath()) {
			<daden-button label="button.save-and-continue" color="blue" (emitItem)="continue()"></daden-button>
		}
	</div>
</div>
